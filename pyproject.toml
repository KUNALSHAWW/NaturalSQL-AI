[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naturalsql"
version = "2.0.0"
description = "A safe, self-checking natural-language interface to SQL databases"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kunal Kumar Shaw" }]
dependencies = [
  "sqlglot>=25",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "pandas>=2.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "streamlit>=1.35", "pandas>=2.1", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
naturalsql = "naturalsql.cli:main"

[tool.setuptools.packages.find]
include = ["naturalsql*"]

[tool.setuptools.package-data]
naturalsql = ["bench/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
